version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: predictmaint
      POSTGRES_PASSWORD: predictmaint
      POSTGRES_DB: predictmaint
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U predictmaint']
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./predictmaint-api
      dockerfile: Dockerfile
    ports:
      - '3001:3001'
    environment:
      DATABASE_URL: postgres://predictmaint:predictmaint@postgres:5432/predictmaint
      DATABASE_SYNC: 'true'
      DATABASE_SEED: 'true'
      JWT_SECRET: change-me-in-production
      JWT_EXPIRES_IN: 8h
      ML_SERVICE_URL: http://ml:8000
      ML_API_KEY: ml-secret-key
      PORT: 3001
    depends_on:
      postgres:
        condition: service_healthy
      ml:
        condition: service_started

  ml:
    build:
      context: ./predictmaint-ml
      dockerfile: Dockerfile
    ports:
      - '8000:8000'
    environment:
      API_KEY: ml-secret-key
      MODEL_ARTIFACTS_PATH: /app/artifacts
    volumes:
      - ./predictmaint-ml/artifacts:/app/artifacts:ro

  web:
    build:
      context: ./predictmaint-web
      dockerfile: Dockerfile
    ports:
      - '3000:3000'
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
    depends_on:
      - api

volumes:
  pgdata:
